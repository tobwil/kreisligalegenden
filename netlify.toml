# Statische Seite ohne Build-Schritt: Landingpage im Hauptordner (index.html), das Spiel unter /game/ (aus src/ gebaut und mit committet).
# Mit dem Repo in Netlify verbunden, bekommt jeder Pull Request automatisch einen eigenen Vorschau-Link (Deploy Preview).
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/spielen"
  to = "/game/"
  status = 301

[[redirects]]
  from = "/spielen.html"
  to = "/game/"
  status = 301

# Entwickler-Ordner nicht in den Suchindex
[[headers]]
  for = "/tests/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Offline-Cache der App: immer die neueste Fassung holen, sonst bliebe ein alter Service Worker hängen
[[headers]]
  for = "/game/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/game/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
